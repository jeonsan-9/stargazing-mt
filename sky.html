<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>현장 하늘 · AAA 징크스 타파기</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
  <link rel="stylesheet" href="css/sky.css">
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
</head>
<body>
  <canvas id="view" tabindex="0" role="img" aria-label="관측지의 하늘과 산 능선" aria-describedby="sky-help"></canvas>
  <header>
    <nav aria-label="관측 메뉴"><a id="back" href="./index.html">← 지도로 돌아가기</a><a id="plan" href="./observe.html">관측 계획</a></nav>
    <h1 id="site-name">현장 하늘</h1>
    <p id="site-elevation"></p>
    <label class="location">관측지 <select id="site"></select></label>
  </header>
  <p id="sky-help">드래그하거나 방향키를 눌러 둘러보세요.</p>
  <div class="controls">
    <div class="directions" aria-label="바라볼 방향">
      <button data-bearing="0" type="button">북</button><button data-bearing="90" type="button">동</button>
      <button data-bearing="180" type="button">남</button><button data-bearing="270" type="button">서</button>
      <button id="look-moon" type="button">달 방향</button>
      <span id="bearing" aria-live="off"></span>
    </div>
    <div class="time">
      <label class="date">관측 날짜 <input id="night" type="date" min="1800-01-01" max="2050-12-31" required></label>
      <label class="scrub">시각 <output id="time" for="minute"></output><input id="minute" type="range" min="0" max="144" value="48"></label>
    </div>
    <p id="status" role="status"></p>
    <details><summary>이 화면의 데이터</summary><p>맑은 하늘을 가정합니다. 산 능선은 높이 자료로 근사했으며 건물과 나무는 생략했습니다. <a href="https://dataspace.copernicus.eu/explore-data/data-collections/copernicus-contributing-missions/copernicus-dem">Copernicus DEM</a> · <a href="https://github.com/ofrohn/d3-celestial/blob/master/data/stars.6.json">별 목록</a> · <a href="js/diorama/stars-LICENSE.txt">라이선스</a></p></details>
  </div>
  <script type="module" src="js/sky.js?v=20261122d"></script>
</body>
</html>
