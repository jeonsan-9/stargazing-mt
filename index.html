<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>별보러 MT</title>
  <meta name="description" content="여러 기상 모델을 종합해 동아리 관측 MT 날짜와 장소를 고르는 3D 지도" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.0.38/dist.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <header>
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#121a36" stroke="#9db4ff" stroke-opacity=".5"/><path d="M13 6l1.6 4.4L19 12l-4.4 1.6L13 18l-1.6-4.4L7 12l4.4-1.6z" fill="#ffd88a"/></svg>
        <h1>별보러 MT</h1>
      </div>
      <p id="status">예보 불러오는 중…</p>
    </header>

    <nav id="tabs" role="tablist">
      <button data-view="week" class="active">주</button>
      <button data-view="month">월</button>
      <button data-view="sem">학기</button>
      <button data-view="year">1년</button>
    </nav>

    <div id="view-week" class="view">
      <section>
        <h2>이번 주 · 외부 관측 갈까 말까</h2>
        <div id="nights"></div>
      </section>
      <section>
        <h2>관측지 점수</h2>
        <div id="list"></div>
        <label class="check"><input type="checkbox" id="toggleExtra" checked /> 비교용 관측지도 보기</label>
      </section>
    </div>
    <div id="view-month" class="view" hidden></div>
    <div id="view-sem" class="view" hidden></div>
    <div id="view-year" class="view" hidden></div>
  </aside>

  <aside id="detailPanel">
    <button id="closeDetail" aria-label="닫기">×</button>
    <div id="detail"></div>
  </aside>

  <div id="controls">
    <div class="row">
      <label class="check"><input type="checkbox" id="toggleCloud" checked /> 구름</label>
      <select id="cloudModel" aria-label="구름 지도 모델"></select>
      <select id="cloudLayer" aria-label="구름 층"></select>
      <span id="moonLabel" class="moonlabel"></span>
      <button id="toggle3d">평면 보기</button>
    </div>
    <div class="row">
      <button id="play" class="play" aria-label="구름 재생">▶</button>
      <input type="range" id="hour" min="0" max="12" value="4" aria-label="시각" />
      <span id="hourLabel"></span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
