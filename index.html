<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAA 징크스 타파기 · 계명대</title>
  <meta name="description" content="여러 기상 모델을 종합해 동아리 관측 MT 날짜와 장소를 고르는 3D 지도" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/diorama-map.css" />
  <script>
    // 디자인 테마: 주소 뒤 ?theme=이름 으로 바꿔 볼 수 있음
    (function () {
      var q = new URLSearchParams(location.search);
      var t = q.get("theme") || "glade";
      if (!/^[a-z]+$/.test(t)) t = "glade";
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.map = q.get("map") === "terrain" ? "terrain" : "diorama";
      document.write('<link rel="stylesheet" id="themeCss" href="css/theme-' + t + '.css" />');
      if (document.documentElement.dataset.map === "terrain") {
        document.write('<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>');
        document.write('<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.0.38/dist.min.js"><\/script>');
      }
    })();
  </script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="diorama-stage">
    <canvas id="scene" aria-label="한반도 3D 디오라마"></canvas>
    <div id="moon" hidden><canvas width="144" height="144" role="img" aria-label="달의 위상"></canvas><span></span></div>
    <div id="pins" data-controls="detailPanel"></div>
    <div id="map-status" role="status"></div>
  </div>
  <div id="tiltShift" aria-hidden="true"></div>
  <div id="moonGlow" aria-hidden="true"></div>
  <div id="skyMoon" aria-hidden="true"><span class="disc"></span><span class="tag"></span></div>

  <aside id="panel">
    <header>
      <div class="brand">
        <svg class="mascot" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <circle cx="24" cy="24" r="22" fill="#28253e" stroke="#76698f"/>
          <path d="m21 7 5 10 11 2-8 8 1 11-10-5-10 4 2-11-7-8 11-1z" fill="#ffe6a8" stroke="#f1cd89" stroke-linejoin="round"/>
          <g fill="#393045"><circle cx="17" cy="22" r="1.4"/><circle cx="23" cy="21" r="1.4"/></g>
          <path d="M18 26q3 3 5-1" fill="none" stroke="#755454" stroke-linecap="round"/>
          <path d="m32 28-4 12m4-12 6 10" fill="none" stroke="#cbbaf2" stroke-width="2.3" stroke-linecap="round"/>
          <g transform="rotate(-24 32 25)">
            <rect x="23" y="23" width="7" height="4" rx="1.5" fill="#cbbaf2"/>
            <rect x="28" y="21.5" width="13" height="7" rx="2" fill="#b6ebd9"/>
            <rect x="38" y="20.5" width="3" height="9" rx="1.5" fill="#ecfff8"/>
          </g>
          <circle cx="29" cy="28" r="2.5" fill="#ffe6a8"/>
        </svg>
        <h1>AAA 징크스 타파기</h1>
        <span class="club">계명대학교 AAA</span>
      </div>
      <p id="status">예보 불러오는 중…</p>
      <a class="diorama-link" id="map-link" href="?map=terrain">기존 지도</a>
      <a class="diorama-link" href="./diorama.html">디오라마 전체 화면</a>
      <button id="tonight-main" class="diorama-link" type="button" aria-controls="detailPanel">보현산 밤하늘</button>
      <a class="diorama-link" id="observe-link" href="./observe.html">관측 도구</a>
    </header>

    <nav id="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="week" class="active">주</button>
      <button role="tab" aria-selected="false" data-view="month">월</button>
      <button role="tab" aria-selected="false" data-view="sem">학기</button>
      <button role="tab" aria-selected="false" data-view="year">1년</button>
    </nav>

    <div id="view-week" class="view">
      <section>
        <h2>이번 주 · 외부 관측 갈까 말까</h2>
        <div id="verdict"></div>
        <div id="nights"></div>
      </section>
      <section>
        <h2>관측지 점수</h2>
        <div id="list"></div>
        <label class="check"><input type="checkbox" id="toggleExtra" checked /> 비교용 관측지도 보기</label>
      </section>
    </div>
    <div id="view-month" class="view" hidden></div>
    <div id="view-sem" class="view" hidden></div>
    <div id="view-year" class="view" hidden></div>
  </aside>

  <aside id="detailPanel">
    <button id="closeDetail" aria-label="닫기">×</button>
    <div id="detail"></div>
  </aside>

  <div id="controls">
    <div class="row">
      <label class="check"><input type="checkbox" id="toggleCloud" checked /> 구름</label>
      <select id="cloudModel" aria-label="구름 지도 모델"></select>
      <select id="cloudLayer" aria-label="구름 층"></select>
      <span id="moonLabel" class="moonlabel"></span>
      <button id="toggle3d">평면 보기</button>
    </div>
    <div class="row">
      <button id="play" class="play" aria-label="구름 재생">▶</button>
      <input type="range" id="hour" min="0" max="12" value="4" aria-label="시각" />
      <span id="hourLabel"></span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
