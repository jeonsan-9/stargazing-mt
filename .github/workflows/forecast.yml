name: 예보 갱신 및 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 */3 * * *" # 3시간마다 (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 예보 수집
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python3 scripts/fetch_forecast.py
      - name: 사이트 묶기
        run: |
          mkdir -p _site
          cp -r index.html diorama.html observe.html sky.html css js data models _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
